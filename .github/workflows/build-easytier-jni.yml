name: Build EasyTier JNI (arm64-v8a)

# EasyClash: 云端可重复构建 EasyTier v2.6.4 的两个原生库。
# 产物仅 arm64-v8a（与官方 build.sh 一致）。本地无法构建 Rust 时使用。
# 手动触发或路径变更触发；产物经 Artifacts 下载后复制到
# core/src/main/jniLibs/arm64-v8a/ 并提交。

on:
  workflow_dispatch:
    inputs:
      easytier_ref:
        description: 'EasyTier tag / ref'
        required: false
        default: 'v2.6.4'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout EasyTier
        uses: actions/checkout@v4
        with:
          repository: EasyTier/EasyTier
          ref: ${{ github.event.inputs.easytier_ref || 'v2.6.4' }}

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95'

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Setup Java (for Android SDK)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK (NDK)
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;29.0.14206865'

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          protoc --version

      - name: Merge FFI into JNI cdylib (single self-contained .so)
        run: |
          # 见 script/build-easytier-jni.sh 头部说明：Android RTLD_LOCAL 下两库方案必然报
          # cannot locate symbol，RTLD_GLOBAL 预加载也无效，故静态合并。
          sed -i 's/crate-type = \["cdylib"\]/crate-type = ["cdylib", "rlib"]/' \
            easytier-contrib/easytier-ffi/Cargo.toml
          printf '\neasytier-ffi = { path = "../easytier-ffi" }\n' \
            >> easytier-contrib/easytier-android-jni/Cargo.toml
          python3 - <<'PY'
          import io
          p = "easytier-contrib/easytier-android-jni/src/lib.rs"
          s = io.open(p, encoding="utf-8").read()
          force = ('// EasyClash: 强制链接 easytier-ffi（未被引用的 rlib 不会进入 cdylib）。\n'
                   '#[used]\n'
                   'static _EASYTIER_FFI_FORCE_LINK: unsafe extern "C" fn(*const std::ffi::c_char) -> std::ffi::c_int =\n'
                   '    easytier_ffi::parse_config;\n\n')
          io.open(p, "w", encoding="utf-8", newline="").write(force + s)
          PY

      - name: Build merged easytier-android-jni (arm64-v8a)
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
          LIBCLANG_PATH: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin
        run: |
          cargo ndk -t arm64-v8a build --release -p easytier-android-jni
          mkdir -p out/arm64-v8a
          cp target/aarch64-linux-android/release/libeasytier_android_jni.so out/arm64-v8a/
          sha256sum out/arm64-v8a/*.so
          # 必须无未定义 EasyTier C API 符号
          if llvm-nm -D --undefined-only out/arm64-v8a/libeasytier_android_jni.so \
               | grep -E "parse_config|run_network_instance|collect_network_infos"; then
            echo "unresolved EasyTier symbols remain"; exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: easytier-jni-arm64-v8a
          path: out/arm64-v8a/*.so
          if-no-files-found: error
